<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MentalTiers</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Hintergrund -->
    <div class="background-grid"></div>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="logo">
            Mental<span>Tiers</span>
        </div>

        <ul class="nav-links">
            <li>Home</li>
            <li>Rankings</li>
            <li>Discord</li>
            <li>API Docs</li>
        </ul>

        <input type="text" placeholder="Search player...">

    </nav>

    <!-- Hero -->
<section class="hero">

    <h1>Mental<span>Tiers</span></h1>

    <p>Minecraft PvP Rankings</p>

    <div class="stats">

        <div class="stat-card">
            <h2 id="playerCount">0</h2>
            <span>👥 Players</span>
        </div>

        <div class="stat-card">
            <h2 id="onlineCount">0</h2>
            <span>👁 Online</span>
        </div>

        <div class="stat-card">
            <h2 id="gamemodeCount">10</h2>
            <span>⭐ Gamemodes</span>
        </div>

    </div>

    <div class="hero-buttons">

        <button class="primary-btn">
            View Rankings
        </button>

        <button class="secondary-btn">
            API Docs
        </button>

    </div>

    <div class="gamemodes">

        <div class="mode">Crystal</div>
        <div class="mode">UHC</div>
        <div class="mode">Sword</div>
        <div class="mode">Axe</div>
        <div class="mode">SMP</div>
        <div class="mode">Mace</div>
        <div class="mode">Pot</div>
        <div class="mode">Netherite</div>
        <div class="mode">NethPot</div>
        <div class="mode">Diamond</div>

    </div>

</section>
