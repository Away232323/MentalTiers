name: Build MentalTiersVerify

on:
  workflow_dispatch:
  push:
    paths:
      - 'minecraft-plugin/**'
      - '.github/workflows/build-verify-plugin.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin
        run: mvn -B -f minecraft-plugin/pom.xml clean package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: MentalTiersVerify
          path: minecraft-plugin/target/MentalTiersVerify.jar
