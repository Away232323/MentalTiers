name: MentalTiers Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check legacy bot syntax
        run: node --check src/index.js

      - name: Check Cloudflare Worker syntax
        run: node --check worker/src/index.js
